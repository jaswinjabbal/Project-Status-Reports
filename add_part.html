{% extends "layout.html" %}
{% block title %}Add Part{% endblock %}
{% block content %}
<h2 class="mb-4">Add a New Part</h2>
<form method="POST" class="row g-3">
    <div class="col-md-6">
        <label class="form-label">Supplier Part Number</label>
        <input type="text" class="form-control" name="part_number" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Manufacturer</label>
        <input type="text" class="form-control" name="manufacturer" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Part Category</label>
        <input type="text" class="form-control" name="category" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">Cost (1pc)</label>
        <input type="text" class="form-control" name="cost" required>
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-success">Add Part</button>
    </div>
</form>
{% endblock %}
