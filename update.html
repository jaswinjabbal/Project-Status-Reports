{% extends "layout.html" %}
{% block title %}Update Part{% endblock %}
{% block content %}
<h2 class="mb-4">Update a Part</h2>
<form method="POST" class="row g-3">
    <div class="col-md-6">
        <label class="form-label">Part Number</label>
        <input type="text" class="form-control" name="part_number" required>
    </div>
    <div class="col-md-6">
        <label class="form-label">New Cost (1pc)</label>
        <input type="text" class="form-control" name="new_cost" required>
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-warning">Update Cost</button>
    </div>
</form>
{% endblock %}
